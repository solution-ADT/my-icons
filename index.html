<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Blooming Station</title>

  <link rel="icon" type="image/png" href="./blooming.png" />
  <link rel="apple-touch-icon" href="./blooming.png" />
  <link rel="manifest" href="./manifest.json" />

  <meta name="theme-color" content="#e994b4" />

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e994b4;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .box {
      padding: 32px;
    }

    img {
      width: 128px;
      height: 128px;
      border-radius: 30px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 34px;
      margin: 12px 0;
    }

    p {
      font-size: 17px;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: white;
      color: #d85f8c;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <img src="./blooming.png" alt="Blooming Station Icon" />
    <h1>Blooming Station</h1>
    <p>오늘의 장면을 기록합니다.</p>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfjTrBupff6PYss4hGDKP-HWbrNjpRN_uAknzV2ggTfvYF_xA/viewform?usp=header">
      기록 시작하기
    </a>
  </div>
</body>
</html>
