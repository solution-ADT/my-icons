<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Captain's Island</title>

  <link rel="icon" href="../island.png">
  <link rel="apple-touch-icon" href="../island.png">
  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#0b4f86">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #8ed7f5, #064778);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .box {
      padding: 32px;
    }

    img {
      width: 128px;
      height: 128px;
      border-radius: 30px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    h1 {
      font-size: 32px;
      margin: 12px 0;
    }

    p {
      font-size: 17px;
      margin-bottom: 28px;
    }

    a {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: white;
      color: #064778;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="box">
    <img src="../island.png" alt="Captain's Island Icon">
    <h1>Captain's Island</h1>
    <p>인물과 사건의 섬으로 들어갑니다.</p>

    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfvWVtzkXBUtiKuOExzJPZjTW8tSa46BovoQ2dvpVr4ns4ydQ/viewform?usp=header">
      기록 시작하기
    </a>
  </div>
</body>
</html>
